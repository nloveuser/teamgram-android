name: Build APK

on:
  push:
    branches: [ teamgram, teamgram2 ]
  pull_request:
    branches: [ teamgram2 ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;21.4.7075529" \
            "cmake;3.22.1" \
            "build-tools;33.0.0" \
            "platforms;android-33"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace
        env:
          GRADLE_OPTS: -Xmx4096m

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teamgram-release-${{ github.run_number }}
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          retention-days: 14
          if-no-files-found: error
